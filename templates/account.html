{% extends "base.html" %}
{% block title %}Account · VideoGeneration{% endblock %}
{% block content %}
<div class="column">
  <section class="panel">
    <div class="profile">
      <span class="avatar" aria-hidden="true">{{ user.email[0] | upper }}</span>
      <div>
        <p class="profile-email">{{ user.email }}</p>
        <p class="muted small">Member since {{ user.created_at.strftime("%-d %B %Y") }}</p>
      </div>
    </div>

    <hr>

    <h2>Change password</h2>
    <p class="muted small">You'll stay signed in on this device.</p>
    <form id="password-form" class="stack">
      <label>Current password
        <input name="current" type="password" autocomplete="current-password" required></label>
      <label>New password
        <input name="new" type="password" autocomplete="new-password" minlength="10" required>
        <span class="hint">At least 10 characters.</span></label>
      <label>Repeat new password
        <input name="repeat" type="password" autocomplete="new-password" minlength="10" required></label>
      <p class="error" id="password-error" hidden></p>
      <div class="form-actions">
        <button type="submit">Change password</button>
        <span id="password-msg" class="ok-text" role="status"></span>
      </div>
    </form>
  </section>
</div>
{% endblock %}
